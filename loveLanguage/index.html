<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Love Heart</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "Σ' αγαπώ",
            "Ik hou van jou", "Jag älskar dig", "Kocham cię", "ฉันรักเธอ"
        ];

        function heartFunction(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * 20 + canvas.width / 2, y: y * 20 + canvas.height / 2 };
        }

        let points = [];
        for (let i = 0; i < Math.PI * 2; i += 0.08) {
            let pos = heartFunction(i);
            points.push({
                x: pos.x,
                y: pos.y,
                text: phrases[Math.floor(Math.random() * phrases.length)],
                color: `hsl(${Math.random() * 60 + 330}, 100%, 70%)`
            });
        }

        let index = 0;
        function draw() {
            if (index < points.length) {
                let p = points[index];
                ctx.font = "bold 14px Arial";
                ctx.fillStyle = p.color;
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
                index++;
                requestAnimationFrame(draw);
            }
        }

        setTimeout(draw, 500);
    </script>
</body>
</html>
