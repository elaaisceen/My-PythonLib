<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Love Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        // Kalp denklemi kontrolü (İçini doldurmak için)
        function isInsideHeart(x, y) {
            let nx = x / 150.0;
            let ny = y / 150.0;
            let eq = Math.pow(nx * nx + ny * ny - 1, 3) - (nx * nx * Math.pow(ny, 3));
            return eq <= 0;
        }

        let elements = [];

        // 1. Aşama: Dış çerçeve noktaları
        for (let i = 0; i < 628; i += 6) {
            let k = i / 100.0;
            let x = 16 * Math.pow(Math.sin(k), 3);
            let y = 13 * Math.cos(k) - 5 * Math.cos(2*k) - 2 * Math.cos(3*k) - Math.cos(4*k);
            
            elements.push({
                x: x * 20 + canvas.width / 2,
                y: -y * 20 + canvas.height / 2,
                text: phrases[Math.floor(Math.random() * phrases.length)],
                hue: ((y * 20 + 200) / 400) * 360
            });
        }

        // 2. Aşama: Yukarıdan aşağıya satır satır iç dolgu
        for (let cy = -220; cy < 240; cy += 18) {
            let hueVal = ((cy + 240) / 480) * 360;
            for (let cx = -240; cx < 260; cx += 24) {
                if (isInsideHeart(cx, cy)) {
                    elements.push({
                        x: cx + canvas.width / 2,
                        y: cy + canvas.height / 2,
                        text: phrases[Math.floor(Math.random() * phrases.length)],
                        hue: hueVal
                    });
                }
            }
        }

        // Akıcı ve yavaş animasyon döngüsü (Videodaki o keyifli akış için)
        let currentIndex = 0;
        function animate() {
            // Her karede kaç kelime çizileceğini ayarlayarak hızı kontrol edebilirsin (Şu an ideal ve akıcı)
            let batchSize = 3; 
            for (let b = 0; b < batchSize && currentIndex < elements.length; b++) {
                let p = elements[currentIndex];
                ctx.font = "bold 11px Arial";
                
                // Yukarıdan aşağıya yumuşak gökkuşağı geçişi
                ctx.fillStyle = `hsl(${p.hue}, 100%, 60%)`;
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
                
                currentIndex++;
            }

            if (currentIndex < elements.length) {
                requestAnimationFrame(animate);
            }
        }

        setTimeout(animate, 400);
    </script>
</body>
</html>
