<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Love Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "Σ' αγαπώ",
            "Ik hou van jou", "Jag älskar dig", "Kocham cię", "ฉันรักเธอ"
        ];

        const SC = 22;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let poly = [];
        for (let i = 0; i < 720; i++) {
            let a = (2 * Math.PI * i) / 720;
            let x = 16 * Math.pow(Math.sin(a), 3);
            let y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
            poly.push({ x: x * SC + centerX, y: -y * SC + centerY });
        }

        let yMax = Math.max(...poly.map(p => p.y));
        let yMin = Math.min(...poly.map(p => p.y));

        let edges = [];
        for (let i = 0; i < poly.length; i++) {
            edges.push([poly[i], poly[(i + 1) % poly.length]]);
        }

        function getSpans(y) {
            let xs = [];
            for (let [p1, p2] of edges) {
                if ((p1.y <= y && y < p2.y) || (p2.y <= y && y < p1.y)) {
                    let x = p1.x + (y - p1.y) * (p2.x - p1.x) / (p2.y - p1.y);
                    xs.push(x);
                }
            }
            xs.sort((a, b) => a - b);
            let spansList = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (i + 1 < xs.length) {
                    spansList.push([xs[i], xs[i+1]]);
                }
            }
            return spansList;
        }

        ctx.font = "bold 10px Arial";
        let rowH = 18; // Satır yüksekliği artırıldı
        let placed = [];
        let phraseIdx = 0;

        for (let y = yMin + rowH/2; y < yMax - rowH/2; y += rowH) {
            let spans = getSpans(y);
            for (let [lo, hi] of spans) {
                if (hi - lo < 30) continue;
                let cur = lo + 5;
                while (cur < hi - 5) {
                    let text = phrases[phraseIdx % phrases.length];
                    phraseIdx++;
                    let w = ctx.measureText(text).width;
                    if (cur + w < hi) {
                        let normY = (y - yMin) / (yMax - yMin);
                        let hue = normY * 360;
                        placed.push({
                            x: cur + w/2,
                            y: y,
                            text: text,
                            hue: hue
                        });
                        cur += w + 12; // Kelimeler arası boşluk bırakıldı
                    } else {
                        break;
                    }
                }
            }
        }

        let currentIndex = 0;
        function animate() {
            let batch = 5;
            for (let i = 0; i < batch && currentIndex < placed.length; i++) {
                let p = placed[currentIndex];
                ctx.font = "bold 10px Arial";
                ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
                currentIndex++;
            }
            if (currentIndex < placed.length) {
                requestAnimationFrame(animate);
            }
        }

        setTimeout(animate, 300);
    </script>
</body>
</html>
